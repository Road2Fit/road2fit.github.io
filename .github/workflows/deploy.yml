name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  # Retour arrière (4.47) : onglet Actions → « Déployer sur GitHub Pages » → Run workflow → écrire la version à remettre
  # en ligne (ex. v4.46). Vide = la dernière version de main. Chaque publication porte une étiquette vX.Y (git tag).
  workflow_dispatch:
    inputs:
      version:
        description: "Version à remettre en ligne (ex. v4.46) ; vide = la dernière"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
